<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>家庭教师 · 纲吉生日跑酷</title>
<meta name="description" content="家庭教师 · 星露谷像素风 · 跳起来接阿纲的生日蛋糕">
<meta name="theme-color" content="#2b2135">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="纲吉跑酷">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; min-height: 100vh; }
  body {
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(255,214,140,.25), transparent 60%),
      linear-gradient(180deg, #2b2135 0%, #1d1a26 100%);
    color: #f3e9d2;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    padding: calc(14px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom));
    -webkit-user-select: none; user-select: none;
  }
  h1 {
    margin: 4px 0 0; font-size: 22px; letter-spacing: 6px; font-weight: 900;
    color: #ffd76e; text-shadow: 0 3px 0 #a05a1e, 0 6px 16px rgba(255,180,80,.35);
  }
  .sub { font-size: 11px; letter-spacing: 3px; color: #b9a98c; margin: 0; }
  .stage { position: relative; width: min(94vw, 460px); }
  canvas#game {
    display: block; width: 100%; height: auto;
    border-radius: 14px; border: 3px solid #5a4632;
    box-shadow: 0 14px 40px rgba(0,0,0,.5), inset 0 0 0 2px #7a6142;
    image-rendering: pixelated; image-rendering: crisp-edges;
    background: #87ceeb;
  }
  #birthday {
    position: absolute; inset: 0; display: none;
    align-items: center;            /* column 方向：align-items 管横向 */
    justify-content: flex-start;    /*           justify-content 管纵向 */
    padding-top: 56px;              /* 靠上摆，别遮住角色和飞来的蛋糕 */
    z-index: 6; pointer-events: none; flex-direction: column; gap: 10px;
  }
  #birthday.show { display: flex; }
  #birthday .bd-text {
    font-size: clamp(18px, 6vw, 26px); font-weight: 900; letter-spacing: 2px; color: #ff8fb8;
    text-align: center; line-height: 1.25; max-width: 92%;
    text-shadow: 0 3px 0 #fff, 0 6px 0 #e0568a, 0 10px 24px rgba(255,110,160,.65);
    animation: bdPop .6s cubic-bezier(.2,1.6,.4,1) both;
  }
  #birthday .bd-sub { font-size: 12px; color: #fff; background: rgba(224,86,138,.88); padding: 5px 18px; border-radius: 999px; letter-spacing: 2px; box-shadow: 0 4px 14px rgba(224,86,138,.5); }
  @keyframes bdPop { from { transform: scale(.3) rotate(-8deg); } 60% { transform: scale(1.15) rotate(3deg); } to { transform: scale(1); } }
  .gallery {
    display: flex; gap: 6px; align-items: baseline; justify-content: center;
    padding: 7px 16px; border-radius: 999px;
    background: rgba(40,30,22,.55); border: 2px solid #5a4632;
  }
  .gallery #cakeCount {
    font-size: 20px; font-weight: 900; color: #ff9ec4; letter-spacing: 1px;
    font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 #a05a1e;
    min-width: 22px; text-align: center;
  }
  .gallery #cakeCount.pop { animation: countPop .35s cubic-bezier(.2,1.7,.4,1); }
  @keyframes countPop { 0% { transform: scale(1); } 45% { transform: scale(1.55); color: #fff; } 100% { transform: scale(1); } }
  .g-label { font-size: 10px; letter-spacing: 2px; color: #b9a98c; }
  .g-unit { font-size: 11px; color: #b9a98c; letter-spacing: 1px; }
  .g-best { font-size: 10px; color: #ffd76e; letter-spacing: 1px; margin-left: 8px; }
  .touch-row { display: none; gap: 14px; }
  .tbtn {
    min-width: 76px; height: 64px; padding: 0 18px; border-radius: 16px; border: 2.5px solid #7a6142; background: rgba(255,255,255,.1);
    color: #ffd76e; font-size: 20px; font-weight: 800; display: grid; place-items: center; cursor: pointer; user-select: none;
    -webkit-user-select: none; touch-action: manipulation;
  }
  .tbtn:active { background: rgba(255,215,110,.25); }
  .tbtn.jump { background: rgba(255,150,80,.2); border-color: #ffb45e; }
  @media (pointer: coarse) { .touch-row { display: flex; } }
  .tips { font-size: 11px; color: #b9a98c; letter-spacing: 1px; text-align: center; line-height: 1.8; margin: 0; }
  .tips b { color: #ffd76e; font-weight: 700; }
  #verTag { color: #6f8f6a; font-size: 10px; letter-spacing: 1px; }
  #over {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center; z-index: 7;
    background: rgba(30,20,28,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  #over.show { display: flex; }
  #over .ov-card { text-align: center; background: rgba(40,30,22,.96); border: 2.5px solid #ffd76e; border-radius: 18px; padding: 22px 30px; }
  #over .ov-title { font-size: 20px; font-weight: 900; color: #ffd76e; letter-spacing: 3px; }
  #over .ov-num { font-size: 30px; font-weight: 900; color: #fff; margin: 10px 0 2px; font-variant-numeric: tabular-nums; }
  #over .ov-sub { font-size: 11px; color: #b9a98c; letter-spacing: 2px; margin-bottom: 14px; }
  #over button {
    border: 0; cursor: pointer; font-family: inherit; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(120deg, #ff9d3d, #ff6f5e); color: #fff; font-size: 15px;
    padding: 11px 26px; border-radius: 12px; box-shadow: 0 6px 16px rgba(255,140,80,.45); transition: .2s;
  }
  #over button:hover { filter: brightness(1.08); transform: translateY(-1px); }

/* 开始遮罩（移动端解锁音频） */
#startOverlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(20, 12, 22, .78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  z-index: 99;
}
#startOverlay.hide { display: none; }
.so-card { text-align: center; background: rgba(40,30,22,.96); border: 2.5px solid #ffd76e; border-radius: 20px; padding: 28px 36px; max-width: 88vw; }
.so-title { font-size: 22px; font-weight: 900; color: #ffd76e; letter-spacing: 4px; }
.so-sub { font-size: 12px; color: #b9a98c; letter-spacing: 2px; margin: 8px 0 18px; }
#startBtn {
  border: 0; cursor: pointer; font-family: inherit; font-weight: 800; letter-spacing: 3px;
  background: linear-gradient(120deg, #ff9d3d, #ff6f5e); color: #fff; font-size: 16px;
  padding: 14px 36px; border-radius: 14px; box-shadow: 0 6px 18px rgba(255,140,80,.5);
}
.so-hint { font-size: 10px; color: #b9a98c; margin-top: 12px; letter-spacing: 1px; }

/* 生日蛋糕彩蛋弹窗 */
#cakePopup {
  position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(20, 12, 22, .55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  z-index: 50; cursor: pointer;
}
#cakePopup.show { display: flex; }
.cp-card { text-align: center; background: rgba(40,30,22,.98); border: 3px solid #ff9ec4; border-radius: 22px; padding: 22px 28px; max-width: 88vw; animation: cpPop .5s cubic-bezier(.2,1.6,.4,1) both; box-shadow: 0 12px 40px rgba(255,158,196,.4); }
@keyframes cpPop { from { transform: scale(.4) rotate(-6deg); opacity: 0; } to { transform: scale(1); opacity: 1; } }
#cpCv { width: 120px; height: 120px; image-rendering: pixelated; margin-bottom: 10px; }
.cp-title { font-size: 22px; font-weight: 900; color: #ff9ec4; letter-spacing: 4px; text-shadow: 0 2px 0 #fff, 0 4px 12px rgba(255,110,160,.6); }
.cp-sub { font-size: 11px; color: #f3e9d2; letter-spacing: 1px; margin: 8px 0 16px; line-height: 1.6; }
#cpClose {
  border: 0; cursor: pointer; font-family: inherit; font-weight: 800; letter-spacing: 2px;
  background: linear-gradient(120deg, #ffd76e, #ff9d3d); color: #5a3a10; font-size: 14px;
  padding: 11px 28px; border-radius: 12px; box-shadow: 0 4px 14px rgba(255,180,80,.5);
  position: relative; z-index: 1;              /* 防止点击冒泡到遮罩 */
}
.cp-hint { font-size: 10px; color: #8f8070; letter-spacing: 1px; margin-top: 10px; }
</style>
</head>
<body>
<h1>纲吉生日跑酷</h1>
<p class="sub">家庭教师 · 星露谷像素风 · 一路向前跑，跳起来接阿纲的生日蛋糕</p>

<div class="stage">
  <canvas id="game" width="480" height="720"></canvas>
  <div id="birthday"><div class="bd-text">HAPPY BIRTHDAY<br>TSUNA ♪</div><div class="bd-sub">泽田纲吉、生日快乐！</div></div>
</div>

<div class="gallery" id="gallery"><span class="g-label">蛋糕收集</span><span id="cakeCount">0</span><span class="g-unit">个</span><span class="g-best" id="cakeBest"></span></div>

<div class="touch-row">
  <div class="tbtn jump" data-k="jump">跳跃 ⤒</div>
</div>
<div id="startOverlay">
  <div class="so-card">
    <div class="so-title">纲吉生日跑酷</div>
    <div class="so-sub">家庭教师 · 跳起来收集礼物</div>
    <button id="startBtn">▶  开 始 游 戏</button>
    <div class="so-hint">首次点击会解锁音效</div>
  </div>
</div>
<div id="cakePopup">
  <div class="cp-card">
    <canvas id="cpCv" width="120" height="120"></canvas>
    <div class="cp-title">HAPPY BIRTHDAY</div>
    <div class="cp-sub" id="cpSub">阿纲的生日蛋糕 · 第 <b id="cpNo">1</b> 个</div>
    <button id="cpClose">收下蛋糕 🎂</button>
    <div class="cp-hint">2.4 秒后自动关闭 · 点任意处可提前关</div>
  </div>
</div>
<p class="tips">阿纲会一直往前跑 · 点 <b>跳跃 / 空格 / ↑</b> 跳起来接蛋糕（可二段跳）<br>空中收集 <b>🎂 生日蛋糕</b> · 每 5 个放一次横幅，每 10 个弹一次彩蛋 · <span id="verTag">v?</span></p>

      }
      bgmTimer += beat * m[1];
      stepIdx++;
    }
  };
  const startBgm = () => {
    if (!ctx) return;
    bgmTimer = ctx.currentTime + 0.1;
    stepIdx = 0;
    const loop = () => { if (ctx) { tickBgm(); setTimeout(loop, 200); } };
    loop();
  };
  return { init, resume, jump, collect, startBgm };
})();
const sfxJump = n => audio.jump(n);

function drawSprite(c, rows, pal, x, y, sc) {

/* ================= 常量与状态 ================= */
const W = cv.width, H = cv.height, SC = 3;
/* 地平线：角色脚下的地面线。放在画面 69% 处（Subway Surfers 是 65%）——
 * 上方留给天空和远景，下方铺「人行道 + 近景路面 + 前景」，两边都不空。 */
const GROUND_Y = 500;
const PLAYER_X = 108;
const PLAYER_H = 128;          // 角色碰撞盒高度（略小于 145 的视觉高度，手感更宽容）
const GRAVITY = 2100;

let dist = 0, speed = 300, gifts = 0;
let running = false, flameT = 0, animT = 0, bannerT = 0, dustT = 0, cakePopT = 0;
let items = [], confetti = [], floaters = [];
let nextItem = 260;





/* 输入 */
function doJump() {
  if (!running) return;

  else if (player.jumps === 1) { player.vy = -740; player.jumps = 2; puff(); sfxJump(2); }
}
const keys = { jump: false };
addEventListener('keydown', e => {

/* 粒子 */
function puff() { for (let i = 0; i < 6; i++) confetti.push({ x: PLAYER_X + 26, y: GROUND_Y - 6, vx: -60 - Math.random() * 60, vy: -Math.random() * 70, life: .5, c: '#e8e0cc', s: 4 }); }
function burst(x, y, color, n) { for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 150; confetti.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, life: 1 + Math.random(), c: color, s: 5 }); } }
/* 飘字：轻量反馈，替代弹窗做「我吃到蛋糕了」的提示 */
function floatText(x, y, txt, color) {
  floaters.push({ x: x, y: y, txt: txt, color: color || '#fff', life: 0.85 });
  if (floaters.length > 12) floaters.shift();
}
function confettiRain() {
  const cols = ['#ff9ec4', '#ffd76e', '#7ed957', '#7fc3ff', '#f2913d'];
  for (let i = 0; i < 70; i++) confetti.push({ x: Math.random() * W, y: -20 - Math.random() * 220, vx: (Math.random() - .5) * 40, vy: 130 + Math.random() * 170, life: 3, c: cols[i % cols.length], s: 6 });
}

/* 生成 */
function spawnStuff() {
  if (dist > nextItem) {
    /* 只保留生日蛋糕。
     * 高度按跳跃物理配平：单跳顶点 y=372，二段跳顶点 y=268。
     *   低蛋糕顶边 355 → 单跳途中必吃到，站着够不着
     *   高蛋糕顶边 220 → 单跳够不着（差 4px），必须二段跳 */
    const high = Math.random() < .42;
    items.push({ type: 'cake', x: W + 60, y: high ? GROUND_Y - 300 : GROUND_Y - 165, bob: Math.random() * Math.PI * 2 });
    nextItem = dist + 200 + Math.random() * 170;
  }
}



/* 蛋糕计数 + 最高纪录 */
const cakeCountEl = document.getElementById('cakeCount');
const cakeBestEl = document.getElementById('cakeBest');
let cakeBest = 0;
try { cakeBest = parseInt(localStorage.getItem('pj_cake_best') || '0', 10) || 0; } catch (e) {}

/* 收集与受击 */
function collect(it) {
  gifts++;
  renderCakeCount();
  cakeCountEl.classList.remove('pop');
  void cakeCountEl.offsetWidth;   /* 强制重排以重放动画 */
  cakeCountEl.classList.add('pop');

  /* 反馈分级：普通蛋糕只给「不打断」的小反馈，
   * 每 5 个才来一次画内横幅 + 彩带雨，每 10 个才弹真正的彩蛋弹窗。
   * 以前每吃一个就盖一层全屏遮罩，跑酷节奏直接被打断。 */
  if (gifts % 5 === 0) { bannerT = 2.2; confettiRain(); sfxCollect(3); }
  if (gifts % 10 === 0) showCakePopup();
}

/* ================= 主循环 ================= */
const player = { y: GROUND_Y, vy: 0, jumps: 0, jumpT: 0 };
let last = performance.now();
function tick(now) {
  requestAnimationFrame(tick);
  const dt = Math.min(.04, (now - last) / 1000); last = now;

  if (running) {
    /* 速度：0.45 → 0.69 屏/秒（Chrome Dino 是 0.6 屏/秒，属于跑酷的常规节奏） */
    speed = 215 + Math.min(115, dist / 85);
    dist += speed * dt;
    /* 跑步相位：4 帧一循环，RUN_FPS 帧/秒 */
    animT = (animT + dt * RUN_FPS / 4) % 1;

    player.vy += GRAVITY * dt;
    player.y += player.vy * dt;
    if (player.jumps > 0) player.jumpT += dt;
    if (player.y >= GROUND_Y) { player.y = GROUND_Y; player.vy = 0; player.jumps = 0; player.jumpT = 0; }

    spawnStuff();

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.x -= speed * dt; it.bob += dt * 3;
      if (it.x < -40) { items.splice(i, 1); continue; }
      const iy = it.y + Math.sin(it.bob) * 6;
      /* 盒重叠：玩家 PLAYER_H 高（脚底对齐 player.y），蛋糕 48x32 */
      const pL = PLAYER_X + 8, pR = PLAYER_X + 62, pT = player.y - PLAYER_H, pB = player.y;
      const cL = it.x, cR = it.x + 48, cT = iy, cB = iy + 32;
      if (pL < cR && pR > cL && pT < cB && pB > cT) { collect(it); items.splice(i, 1); }
    }
    if (flameT > 0) flameT -= dt;
    dustT -= dt;
    if (dustT <= 0 && player.jumps === 0) {
      confetti.push({ x: PLAYER_X + 6, y: GROUND_Y - 5, vx: -70 - Math.random() * 50, vy: -20 - Math.random() * 40, life: .45, c: '#d8cdb4', s: 4 });
      dustT = .26;
    }
  }

  if (bannerT > 0) { bannerT -= dt; document.getElementById('birthday').classList.toggle('show', bannerT > 0); }
  if (cakePopT > 0) { cakePopT -= dt; if (cakePopT <= 0) closeCakePopup(); }

  for (let i = confetti.length - 1; i >= 0; i--) {
    const p = confetti[i];
    p.x += p.vx * dt - (running ? speed * dt * .25 : 0); p.y += p.vy * dt; p.vy += 260 * dt; p.life -= dt;
    if (p.life <= 0 || p.y > H + 20) confetti.splice(i, 1);
  }
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= 46 * dt; f.life -= dt;
    if (f.life <= 0) floaters.splice(i, 1);
  }

  draw();
}

/* ================= 绘制 ================= */
/* 一层滚动贴图：用纯色矩形拼，避免逐像素画造成的采样噪声 */
function band(y, h, color) { ctx.fillStyle = color; ctx.fillRect(0, Math.round(y), W, Math.round(h)); }

/* 远处起伏的山脊（纯色剪影 + 大气透视，越远越淡越蓝） */
function hills(baseY, amp, segW, off, color) {
  ctx.fillStyle = color;
  const step = segW;
  const start = -Math.floor(off / step) * step - step;
  for (let x = start; x < W + step * 2; x += step) {
    const cx = x - (off % step);
    ctx.beginPath();
    ctx.moveTo(cx - step * .62, baseY);
    ctx.quadraticCurveTo(cx, baseY - amp, cx + step * .62, baseY);
    ctx.closePath(); ctx.fill();
  }
  ctx.fillRect(0, Math.round(baseY), W, H - baseY);
}

function draw() {
  /* ===== 并盛町住宅街 =====
   * 视差分层（越远越慢、越淡越蓝 —— 这就是「大气透视」，是画面层次感的来源）：
   *   云 0.08 · 远山 0.16 · 远景住宅 0.30 · 树篱+路灯 0.48
   *   草地 0.72 · 人行道 1.00 · 路缘 1.00 · 路面 1.18 · 前景灌木 1.42
   * 三条铁律：
   *   1) 角色脚下那层必须 1.00×，脚才不打滑
   *   2) 比角色更靠近镜头的层要更快（路面 1.18×、前景 1.42×），画面立刻有纵深和速度感
   *   3) 远景统一往天空色里褪，越远越淡，主角永远是画面里最清楚的东西
   * 之前版本的问题：地平线在 86% 处、空掉 620px 天空，远景房子比主角还大，
   * 还有一根电线横切整个天空 —— 这三样加起来就是「画面很奇怪」。 */

  /* ---------- 天空 ---------- */
  const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y + 60);
  sky.addColorStop(0, '#54a6de');
  sky.addColorStop(.36, '#87c6e9');
  sky.addColorStop(.66, '#b6ddf1');
  sky.addColorStop(.88, '#e2eee9');
  sky.addColorStop(1, '#f7e7c6');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  /* 太阳 + 光晕 */
  ctx.fillStyle = 'rgba(255,247,214,.55)';
  ctx.beginPath(); ctx.arc(372, 108, 40, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,251,232,.9)';
  ctx.beginPath(); ctx.arc(372, 108, 22, 0, Math.PI * 2); ctx.fill();

  /* ---------- 云 0.08×（同一层，速度必须一致）---------- */
  const cOff = (dist * .08) % 340;
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  [[-70, 58, 92], [150, 96, 70], [40, 142, 56], [250, 172, 74], [140, 214, 46],
   [-40, 252, 66], [210, 288, 52]].forEach(([x, y, w], i) => {
    const xx = ((x - cOff) % 340 + 340) % 340 - 70;
    ctx.fillRect(xx, y, w, 13);
    ctx.fillRect(xx + 12, y - 10, w - 26, 11);
    if (i % 3 === 0) ctx.fillRect(xx + 30, y - 16, Math.max(12, w - 70), 7);
    if (i % 3 === 1) { ctx.fillRect(xx + 24, y - 15, 20, 6); ctx.fillRect(xx + 48, y - 18, 14, 9); }
    if (i % 3 === 2) ctx.fillRect(xx + 34, y - 14, Math.max(10, w - 80), 5);
  });

  /* 小鸟（0.08×，和云同层） */
  ctx.fillStyle = 'rgba(90,110,130,.55)';
  const bOff = (dist * .08) % 420;
  [[210, 168], [244, 152], [262, 176]].forEach(([bx, by], i) => {
    const xx = ((bx - bOff + i * 7) % 420 + 420) % 420 - 60;
    ctx.fillRect(xx, by, 6, 2); ctx.fillRect(xx + 5, by - 2, 4, 3);
  });

  /* ---------- 远山 0.14× / 0.20×（大气透视：越远越淡越蓝）---------- */
  hills(452, 128, 210, dist * .14, '#b0cde3');
  hills(462, 74, 158, dist * .20, '#96b9d5');
  hills(470, 44, 124, dist * .26, '#7fa6c6');

  /* ---------- 远处楼群天际线 0.26× ---------- */
  const sOff2 = (dist * .26) % 260;
  for (let x = -260; x < W + 260; x += 260) {
    const tx = x - sOff2;
    ctx.fillStyle = '#aec6d8';
    ctx.fillRect(tx + 20, 396, 26, 66);
    ctx.fillRect(tx + 58, 370, 20, 92);
    ctx.fillRect(tx + 90, 410, 32, 52);
    ctx.fillRect(tx + 140, 386, 24, 76);
    ctx.fillRect(tx + 178, 418, 28, 44);
    ctx.fillStyle = '#9ab4c8';
    for (let i = 0; i < 5; i++) ctx.fillRect(tx + 22 + (i % 3) * 8, 402 + i * 13, 4, 5);
  }

  /* ---------- 远景住宅 0.30×（矮、淡、冷）---------- */
  const hOff = (dist * .30) % 300;
  for (let x = -300; x < W + 300; x += 300) {
    const hx = x - hOff;
    /* 房子 A */
    ctx.fillStyle = '#e6ebec'; ctx.fillRect(hx, 410, 74, 58);
    ctx.fillStyle = '#bcc8d0'; ctx.fillRect(hx - 4, 403, 82, 10);
    ctx.fillStyle = '#aab7c0'; ctx.fillRect(hx - 4, 400, 82, 4);
    ctx.fillStyle = '#cfe0e8'; ctx.fillRect(hx + 10, 424, 16, 13); ctx.fillRect(hx + 44, 424, 16, 13);
    ctx.fillStyle = '#c3ccd2'; ctx.fillRect(hx + 26, 440, 18, 28);
    /* 房子 B（矮一些、暖一点） */
    ctx.fillStyle = '#efe6d6'; ctx.fillRect(hx + 128, 422, 66, 46);
    ctx.fillStyle = '#c98f6a'; ctx.fillRect(hx + 120, 415, 82, 10);
    ctx.fillStyle = '#b3795a'; ctx.fillRect(hx + 120, 412, 82, 4);
    ctx.fillStyle = '#cfe0e8'; ctx.fillRect(hx + 138, 434, 14, 11); ctx.fillRect(hx + 166, 434, 14, 11);
    /* 树 */
    ctx.fillStyle = '#7fa07c'; ctx.fillRect(hx + 100, 436, 7, 32);
    ctx.fillStyle = '#8fb189'; ctx.fillRect(hx + 88, 412, 31, 28);
  }

  /* ---------- 树篱 + 路灯 0.48× ---------- */
  const tOff = (dist * .48) % 120;
  ctx.fillStyle = '#7d9e78';
  for (let x = -120; x < W + 120; x += 120) {
    const tx = x - tOff;
    ctx.fillRect(tx, 440, 84, 44);
    ctx.fillRect(tx + 6, 430, 30, 14);
    ctx.fillRect(tx + 44, 433, 26, 11);
  }
  ctx.fillStyle = '#6c8c68';
  for (let x = -120; x < W + 120; x += 120) ctx.fillRect(x - tOff, 476, 120, 10);

  /* 路灯（细杆，不横切天空） */
  const lOff = (dist * .48) % 260;
  for (let x = -260; x < W + 260; x += 260) {
    const lx = x - lOff;
    ctx.fillStyle = '#9aa8b2'; ctx.fillRect(lx, 358, 5, 126);
    ctx.fillRect(lx - 12, 354, 29, 6);
    ctx.fillStyle = '#ffe6a8'; ctx.fillRect(lx - 8, 360, 9, 7);
  }

  /* ---------- 草地 0.72×（角色身后、更远的平面）---------- */
  const grassTop = 476;
  band(grassTop, GROUND_Y - grassTop, '#a9c489');
  ctx.fillStyle = '#95b374';
  const gOff = (dist * .72) % 76;
  for (let x = -76; x < W + 76; x += 76) ctx.fillRect(x - gOff, grassTop, 22, 7);
  ctx.fillStyle = '#87a866';
  const gOff2 = (dist * .72) % 150;
  for (let x = -150; x < W + 150; x += 150) ctx.fillRect(x - gOff2, GROUND_Y - 16, 34, 6);

  /* 草地上的小道具（邮箱 / 灌木，都矮，不遮主角） */
  const pOff = (dist * .72) % 340;
  for (let x = -340; x < W + 340; x += 340) {
    const px = x - pOff;
    ctx.fillStyle = '#6f8f6a'; ctx.fillRect(px + 60, 452, 34, 26);
    ctx.fillRect(px + 64, 444, 26, 12);
    ctx.fillStyle = '#c98f6a'; ctx.fillRect(px + 200, 454, 14, 22);
    ctx.fillRect(px + 196, 446, 22, 11);
    ctx.fillStyle = '#e8b7a0'; ctx.fillRect(px + 201, 450, 12, 4);
  }

  /* ---------- 人行道 1.00×（角色脚下，速度必须等于地面速度）---------- */
  band(GROUND_Y, 36, '#d3c8b0');
  ctx.fillStyle = '#bdb196';
  const sOff = dist % 48;
  for (let x = -48; x < W + 48; x += 48) ctx.fillRect(x - sOff, GROUND_Y + 2, 3, 32);
  /* 人行道靠草地那条边：一条 1.00× 的亮边，作为「脚下的基准线」 */
  ctx.fillStyle = '#e2d8c2'; ctx.fillRect(0, GROUND_Y, W, 3);

  /* ---------- 路缘 + 柏油路（近景前景，1.18×，比人行道更快）---------- */
  band(GROUND_Y + 36, 12, '#b9ad93');
  ctx.fillStyle = '#8b8478'; ctx.fillRect(0, GROUND_Y + 48, W, 3);
  ctx.fillStyle = '#6f6a62'; ctx.fillRect(0, GROUND_Y + 51, W, H - GROUND_Y - 51);
  /* 靠路缘那侧被阳光照亮的一条 */
  ctx.fillStyle = '#837c70'; ctx.fillRect(0, GROUND_Y + 51, W, 34);
  /* 车道虚线（1.18×，滚动更快 = 速度感） */
  ctx.fillStyle = '#d9cfb6';
  const rOff = (dist * 1.18) % 96;
  for (let x = -96; x < W + 96; x += 96) ctx.fillRect(x - rOff, GROUND_Y + 112, 46, 8);
  /* 井盖 + 裂缝，让路面不是一块死灰 */
  const mOff = (dist * 1.18) % 300;
  for (let x = -300; x < W + 300; x += 300) {
    const mx = x - mOff;
    ctx.fillStyle = '#5d584f';
    ctx.beginPath(); ctx.ellipse(mx + 150, GROUND_Y + 76, 19, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7b756a';
    ctx.beginPath(); ctx.ellipse(mx + 150, GROUND_Y + 74, 15, 4, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = 'rgba(45,38,30,.22)';
  const crOff = (dist * 1.18) % 210;
  for (let x = -210; x < W + 210; x += 210) {
    ctx.fillRect(x - crOff, GROUND_Y + 148, 34, 2);
    ctx.fillRect(x - crOff + 30, GROUND_Y + 150, 2, 14);
  }

  /* ---------- 前景花坛 1.42×（最靠近镜头，滚得最快，用来压住画面下缘）---------- */
  const fOff = (dist * 1.42) % 130;
  ctx.fillStyle = '#3d5738';
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = -130; x < W + 130; x += 130) {
    const fx = x - fOff;
    ctx.quadraticCurveTo(fx + 32, H - 78, fx + 65, H - 48);
    ctx.quadraticCurveTo(fx + 98, H - 74, fx + 130, H - 52);
  }
  ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  /* 花坛顶部的高光 + 几朵小花（呼应生日主题） */
  ctx.fillStyle = '#4f7046';
  for (let x = -130; x < W + 130; x += 130) {
    const fx = x - fOff;
    ctx.fillRect(fx + 8, H - 62, 18, 5);
    ctx.fillRect(fx + 46, H - 52, 22, 5);
    ctx.fillRect(fx + 92, H - 60, 16, 5);
  }
  ctx.fillStyle = '#ff9ec4';
  for (let x = -130; x < W + 130; x += 130) {
    const fx = x - fOff;
    ctx.fillRect(fx + 14, H - 66, 5, 5);
    ctx.fillRect(fx + 54, H - 56, 5, 5);
    ctx.fillRect(fx + 98, H - 64, 5, 5);
  }

  /* ---------- 道具：只有生日蛋糕 ---------- */
  for (const it of items) {
    const iy = it.y + Math.sin(it.bob) * 6;
    drawSprite(ctx, ITEM_CAKE, PAL, it.x, iy, 4);
  }

  drawPlayer();

  /* ---------- 统一光影 ---------- */
  /* 右上角一小片暖光 + 四角压暗。
   * 有了这层，所有远近层的光源方向才一致，颜色也收拢到同一套调子里 ——
   * 这是「画面看起来专业」和「像一堆色块拼的」的分界线。 */
  const light = ctx.createRadialGradient(372, 108, 40, 372, 108, H * 1.05);
  light.addColorStop(0, 'rgba(255,242,205,.20)');
  light.addColorStop(.34, 'rgba(255,238,198,.07)');
  light.addColorStop(1, 'rgba(24,34,56,.17)');
  ctx.fillStyle = light; ctx.fillRect(0, 0, W, H);

  for (const p of confetti) { ctx.globalAlpha = Math.min(1, p.life); ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.s, p.s); }
  ctx.globalAlpha = 1;
  /* 飘字 */
  ctx.textAlign = 'center'; ctx.font = '900 24px "PingFang SC", sans-serif';
  ctx.lineJoin = 'round';
  for (const f of floaters) {
    const a = Math.min(1, f.life / 0.35);
    ctx.globalAlpha = a;
    const x = Math.round(f.x), y = Math.round(f.y);
    ctx.strokeStyle = 'rgba(46,28,20,.85)'; ctx.lineWidth = 4;
    ctx.strokeText(f.txt, x, y);
    ctx.fillStyle = f.color;
    ctx.fillText(f.txt, x, y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(40,30,22,.75)'; ctx.fillRect(10, 10, 150, 30);
  ctx.fillStyle = '#ffd76e'; ctx.font = '900 15px "PingFang SC", sans-serif';
  ctx.fillText('🎁 ' + gifts + '  ·  ' + Math.floor(dist / 50) + ' m', 20, 31);
}

/* 跑步帧查表：非均匀时长（并腿帧只占 11%，闪一下就过 → 读起来是跑不是走） */
function runFrameIndex(phase) {
  for (let i = 0; i < 4; i++) if (phase < RUN_CUM[i + 1]) return i;
  return 3;
}

function drawPlayer() {
  const px = Math.round(PLAYER_X);
  const air = player.jumps > 0;

  /* 影子：椭圆，高度越高越小越淡（原来是一块灰方块，像贴纸） */
  const airH = Math.max(0, GROUND_Y - player.y);
  const k = Math.max(0, 1 - airH / 240);
  ctx.save();
  ctx.globalAlpha = .10 + .22 * k;
  ctx.fillStyle = '#3a2f26';
  ctx.beginPath();
  ctx.ellipse(px + 34, GROUND_Y + 5, 20 * (.45 + .55 * k), 5 * (.35 + .65 * k), 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  /* 选帧：在地 = 跑步循环；空中 = 按速度选跳跃帧 */
  let img, bob = 0;
  if (air) {
    /* 4 张跳跃帧各司其职：
     *   0 蓄力蹲（蹬地那一瞬间） 1 上升 2 顶点团身 3 下落
     * 蹬地帧只在起跳后 75ms 内出现 —— 那时人还贴着地面，读起来才是「蹬出去」而不是「凭空飞起」 */
    if (player.jumps === 1 && player.jumpT < 0.075) img = JUMP_IMGS[0];
    else if (player.vy < -260) img = JUMP_IMGS[1];      // 上升
    else if (player.vy < 120) img = JUMP_IMGS[2];        // 顶点（团身）
    else img = JUMP_IMGS[3];                             // 下落
  } else {
    img = RUN_IMGS[runFrameIndex(animT)];
    /* 跑动起伏：落地时最低，一个循环上下一次；只往上不往下，脚永远不穿地 */
    bob = -Math.round(RUN_BOB * (1 - Math.cos(animT * Math.PI * 2)) / 2);
  }

  /* 统一尺寸 + 整数坐标：像素画在非整数位置会亚像素重采样，边缘每帧都在闪 */
  const tw = img.width, th = img.height;
  const cx = px + 34;                       // 水平中心，整数
  const by = Math.round(player.y) + bob;   // 脚底，整数（bob 只向上抬）

  /* 身体前倾 5°：站着和跑步最直观的区别就是这个角度 */
  ctx.save();
  ctx.translate(cx, by);
  ctx.rotate(air ? (player.vy < 0 ? -0.10 : 0.07) : 0.05);   // 额外前倾 3°（画稿本身已有前倾）
  ctx.drawImage(img, -(tw >> 1), -th, tw, th);
  ctx.restore();

  if (flameT > 0) {
    const fx = cx - 6, fy = by - th - 12 + Math.round(Math.sin(performance.now() / 90) * 2);
    ctx.fillStyle = '#ff9d3d';
    ctx.fillRect(fx, fy, 6, 10); ctx.fillRect(fx - 3, fy + 4, 12, 8);
    ctx.fillStyle = '#ffd76e'; ctx.fillRect(fx + 1, fy + 5, 4, 8);
  }
}

/* 等分镜加载完再开主循环 */
TUNA_READY.then(() => requestAnimationFrame(tick));
})();
</script>
